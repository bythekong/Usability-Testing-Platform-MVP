name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JWT_SECRET: ci-only-secret-that-is-long-enough-for-tests
  NEXT_PUBLIC_API_URL: http://localhost:4000
  NEXT_PUBLIC_EXTENSION_ID: test-extension-id
  EXTENSION_API_URL: http://localhost:4000
  WEB_APP_ORIGINS: http://localhost/*
  DATABASE_URL: postgresql://postgres:password@localhost:5432/usability_ci?schema=public

jobs:
  quality:
    name: Typecheck, build and lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Restore build caches
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            apps/web/.next/cache
          key: ${{ runner.os }}-build-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}-
            ${{ runner.os }}-build-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @usability-testing/api db:generate
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm lint

  integration:
    name: API integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: usability_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/usability_ci?schema=public
      JWT_SECRET: ci-only-secret-that-is-long-enough-for-tests
      TEST_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @usability-testing/api db:generate
      - run: pnpm --filter @usability-testing/api db:migrate:deploy
      - run: pnpm --filter @usability-testing/shared build
      - run: pnpm --filter @usability-testing/api build
      - run: pnpm --filter @usability-testing/api test:run
